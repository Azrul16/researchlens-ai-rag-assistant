name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: researchlens
          POSTGRES_PASSWORD: researchlens
          POSTGRES_DB: researchlens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U researchlens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://researchlens:researchlens@localhost:5432/researchlens_test
      TEST_DATABASE_URL: postgresql+asyncpg://researchlens:researchlens@localhost:5432/researchlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: curl --fail http://localhost:8000/api/v1/health && curl --fail http://localhost:3000
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
